name: Dovera signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DOVERA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOVERA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing DOVERA_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing DOVERA_KEYSTORE_PASSWORD" >&2; exit 1; }

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          ref: dovera/brand-identity-pass
          submodules: recursive

      - name: Set up Nix for reproducible native builds
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 2

      - name: Build Dovera native engine for ARM64 and ARMv7
        shell: bash
        run: |
          set -euo pipefail
          LIBS="apps/multiplatform/common/src/commonMain/cpp/android/libs"
          mkdir -p "$LIBS/arm64-v8a" "$LIBS/armeabi-v7a"

          nix build -L '.#hydraJobs.x86_64-linux."aarch64-android:lib:simplex-chat"' --out-link result-simplex-arm64
          unzip -oq result-simplex-arm64/pkg-aarch64-android-libsimplex.zip -d "$LIBS/arm64-v8a"
          nix build -L '.#hydraJobs.x86_64-linux."aarch64-android:lib:support"' --out-link result-support-arm64
          unzip -oq result-support-arm64/pkg-aarch64-android-libsupport.zip -d "$LIBS/arm64-v8a"

          nix build -L '.#hydraJobs.x86_64-linux."armv7a-android:lib:simplex-chat"' --out-link result-simplex-armv7
          unzip -oq result-simplex-armv7/pkg-armv7a-android-libsimplex.zip -d "$LIBS/armeabi-v7a"
          nix build -L '.#hydraJobs.x86_64-linux."armv7a-android:lib:support"' --out-link result-support-armv7
          unzip -oq result-support-armv7/pkg-armv7a-android-libsupport.zip -d "$LIBS/armeabi-v7a"

          for abi in arm64-v8a armeabi-v7a; do
            test -s "$LIBS/$abi/libsimplex.so"
            test -s "$LIBS/$abi/libsupport.so"
            echo "Verified native libraries for $abi"
            sha256sum "$LIBS/$abi/"*.so
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/23.1.7779620"
            if sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;23.1.7779620"; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "NDK install failed after 3 attempts" >&2; exit 1; fi
            sleep 15
          done
          test -x "$ANDROID_HOME/ndk/23.1.7779620/ndk-build"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_PATH"

      - name: Restore Dovera signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DOVERA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dovera-upload.jks"
          test -s "$RUNNER_TEMP/dovera-upload.jks"
          chmod 600 "$RUNNER_TEMP/dovera-upload.jks"

      - name: Build and sign Dovera FOSS release APKs
        working-directory: apps/multiplatform
        env:
          STORE_PASSWORD: ${{ secrets.DOVERA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :android:assembleFossRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/dovera-upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="dovera-upload" \
            -Pandroid.injected.signing.key.password="$STORE_PASSWORD"

      - name: Verify signed APKs
        run: |
          set -euo pipefail
          APK_DIR="apps/multiplatform/android/build/outputs/apk/foss/release"
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          test "${#apks[@]}" -ge 1
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: dovera-signed-release-apks
          path: apps/multiplatform/android/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Dovera test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dovera-signed-test-${{ github.run_number }}
          target_commitish: dovera/brand-identity-pass
          name: Dovera signed test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: apps/multiplatform/android/build/outputs/apk/foss/release/*.apk

      - name: Publish signed APKs as a clearly marked test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dovera-signed-test-${{ github.run_number }}
          name: Dovera signed Android test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: apps/multiplatform/android/build/outputs/apk/foss/release/*.apk
