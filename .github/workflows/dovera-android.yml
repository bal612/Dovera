name: Dovera Android debug

on:
  push:
    branches:
      - main
      - "dovera/**"
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/dovera-android.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Nix for reproducible native builds
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 2

      - name: Build Dovera native engine for ARM64 and ARMv7
        shell: bash
        run: |
          set -euo pipefail
          LIBS="apps/multiplatform/common/src/commonMain/cpp/android/libs"
          mkdir -p "$LIBS/arm64-v8a" "$LIBS/armeabi-v7a"

          # ARM64: build the chat engine and Android support runtime from pinned source revisions.
          nix build -L '.#hydraJobs.x86_64-linux."aarch64-android:lib:simplex-chat"' --out-link result-simplex-arm64
          unzip -oq result-simplex-arm64/pkg-aarch64-android-libsimplex.zip -d "$LIBS/arm64-v8a"
          nix build -L '.#hydraJobs.x86_64-linux."aarch64-android:lib:support"' --out-link result-support-arm64
          unzip -oq result-support-arm64/pkg-aarch64-android-libsupport.zip -d "$LIBS/arm64-v8a"

          # ARMv7: keep compatibility with older Android phones.
          nix build -L '.#hydraJobs.x86_64-linux."armv7a-android:lib:simplex-chat"' --out-link result-simplex-armv7
          unzip -oq result-simplex-armv7/pkg-armv7a-android-libsimplex.zip -d "$LIBS/armeabi-v7a"
          nix build -L '.#hydraJobs.x86_64-linux."armv7a-android:lib:support"' --out-link result-support-armv7
          unzip -oq result-support-armv7/pkg-armv7a-android-libsupport.zip -d "$LIBS/armeabi-v7a"

          for abi in arm64-v8a armeabi-v7a; do
            test -s "$LIBS/$abi/libsimplex.so"
            test -s "$LIBS/$abi/libsupport.so"
            echo "Verified native libraries for $abi"
            sha256sum "$LIBS/$abi/"*.so
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          # Avoid pipefail treating yes' SIGPIPE (after sdkmanager accepts licenses) as a failure.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

          # NDK downloads can be interrupted on hosted runners. Remove partial SDK
          # downloads and retry the pinned version before failing the job.
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/23.1.7779620"
            if sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;23.1.7779620"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK 23.1.7779620 failed after 3 clean download attempts" >&2
              exit 1
            fi
            sleep 15
          done
          test -x "$ANDROID_HOME/ndk/23.1.7779620/ndk-build"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_PATH"

      - name: Build Dovera FOSS debug APK
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --stacktrace -Psimplex.assets.dir=../../assets :android:assembleFossDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dovera-android-foss-debug
          path: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dovera-test-${{ github.run_number }}
          name: Dovera Android test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
