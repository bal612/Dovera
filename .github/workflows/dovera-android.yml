name: Dovera Android debug

on:
  push:
    branches:
      - dovera-branding
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/dovera-android.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;23.1.7779620"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_PATH"

      - name: Build Dovera FOSS debug APK
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --stacktrace :android:assembleFossDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dovera-android-foss-debug
          path: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
