name: Dovera Android debug

on:
  push:
    branches:
      - dovera-branding
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/dovera-android.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

          # NDK downloads can be interrupted on hosted runners. Remove partial SDK
          # downloads and retry the pinned version before failing the job.
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/23.1.7779620"
            if sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;23.1.7779620"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK 23.1.7779620 failed after 3 clean download attempts" >&2
              exit 1
            fi
            sleep 15
          done
          test -x "$ANDROID_HOME/ndk/23.1.7779620/ndk-build"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_PATH"

      - name: Install Nix for upstream Android native libraries
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
            keep-outputs = true
            keep-derivations = true

      - name: Build and install SimpleX native libraries
        env:
          NIX_CONFIG: experimental-features = nix-command flakes
        run: |
          set -euxo pipefail
          LIBS="apps/multiplatform/common/src/commonMain/cpp/android/libs"
          mkdir -p "$LIBS/arm64-v8a" "$LIBS/armeabi-v7a"

          nix build '.#hydraJobs.x86_64-linux.aarch64-android:lib:simplex-chat' -o result-arm64-simplex
          unzip -o result-arm64-simplex/pkg-aarch64-android-libsimplex.zip -d "$LIBS/arm64-v8a"
          nix build '.#hydraJobs.x86_64-linux.aarch64-android:lib:support' -o result-arm64-support
          unzip -o result-arm64-support/pkg-aarch64-android-libsupport.zip -d "$LIBS/arm64-v8a"

          nix build '.#hydraJobs.armv7a-android:lib:simplex-chat.x86_64-linux' -o result-armv7-simplex
          unzip -o result-armv7-simplex/pkg-armv7a-android-libsimplex.zip -d "$LIBS/armeabi-v7a"
          nix build '.#hydraJobs.armv7a-android:lib:support.x86_64-linux' -o result-armv7-support
          unzip -o result-armv7-support/pkg-armv7a-android-libsupport.zip -d "$LIBS/armeabi-v7a"

          test -s "$LIBS/arm64-v8a/libsimplex.so"
          test -s "$LIBS/arm64-v8a/libsupport.so"
          test -s "$LIBS/armeabi-v7a/libsimplex.so"
          test -s "$LIBS/armeabi-v7a/libsupport.so"
          file "$LIBS"/*/*.so

      - name: Verify native library architectures
        run: |
          set -euxo pipefail
          LIBS="apps/multiplatform/common/src/commonMain/cpp/android/libs"
          readelf -h "$LIBS/arm64-v8a/libsimplex.so" | grep -E 'Machine:.*AArch64'
          readelf -h "$LIBS/arm64-v8a/libsupport.so" | grep -E 'Machine:.*AArch64'
          readelf -h "$LIBS/armeabi-v7a/libsimplex.so" | grep -E 'Machine:.*ARM'
          readelf -h "$LIBS/armeabi-v7a/libsupport.so" | grep -E 'Machine:.*ARM'
          for lib in "$LIBS"/*/*.so; do
            test -s "$lib"
            file "$lib"
          done

      - name: Archive verified native libraries
        uses: actions/upload-artifact@v4
        with:
          name: dovera-android-native-libraries
          path: apps/multiplatform/common/src/commonMain/cpp/android/libs/*/*.so
          if-no-files-found: error
          retention-days: 14

      - name: Build Dovera FOSS debug APK
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --stacktrace :android:assembleFossDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dovera-android-foss-debug
          path: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
