name: Dovera Android debug

on:
  push:
    branches:
      - dovera-branding
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/dovera-android.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 23.1.7779620
          link-to-sdk: true

      - name: Set up CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Build Dovera FOSS debug APK
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --stacktrace :android:assembleFossDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dovera-android-foss-debug
          path: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
