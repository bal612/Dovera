# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# IDE settings may override values specified in this file.
# Give Android packaging enough heap on the GitHub Actions runner.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.jvm.target=11

android.version_name=7.0.4
android.version_code=384

desktop.version_name=7.0.4
desktop.version_code=166

kotlin.version=2.1.20
gradle.plugin.version=8.7.0
compose.version=1.8.2

# Choose sqlite or postgres backend
database.backend=sqlite
